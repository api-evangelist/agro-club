aid: agro-club
name: Agro Club
description: >-
  Agro.Club is a US-based agtech company operating a digital grain trading and crop
  marketing marketplace that connects farmers with grain buyers. The platform offers
  competitive bids for corn, wheat, soybeans and other grains, along with logistics
  (truck and rail transportation), quality control, financing, and market insights.
  Farmers can transact through cash, FOB or delivered, and basis contracts, plus a
  Firm Offer price-target monitoring service. Agro.Club serves tens of thousands of
  farmers and grain companies across the largest agricultural hubs. It was surfaced as
  a portfolio company of Speedinvest and added to the API Evangelist network. Agro.Club
  does not publish a public developer API, SDKs, or documentation; its api.agro.club
  host is a private backend that serves the company's own applications.
